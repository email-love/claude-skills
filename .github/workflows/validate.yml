name: validate

# Validation and packaging for pull requests and the default branch.
# This workflow can never publish: its token is read-only and checkout
# credentials are not persisted.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate repo
        run: python3 scripts/validate_repo.py

      - name: Quality-gate validator self-test
        run: python3 tests/quality-gates/validate_quality_pack.py --self-test

      - name: Figma quality-gates script self-tests
        run: |
          python3 plugins/email-love/skills/figma-quality-gates/scripts/validate_batch_snapshot.py --self-test
          python3 plugins/email-love/skills/figma-quality-gates/scripts/check_icon_perimeter.py --self-test

      - name: Build bundles
        run: bash build.sh

      - name: Verify bundles (inventory, containment, parity, checksums, determinism)
        run: bash scripts/verify_dist.sh
